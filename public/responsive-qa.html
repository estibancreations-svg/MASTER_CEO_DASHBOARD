<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Responsive QA Harness</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:20px;background:#dfe3eb;font-family:system-ui}
    main{display:grid;gap:24px}.device{background:#fff;border-radius:12px;padding:12px;width:max-content;max-width:100%}
    h2{font-size:14px;margin:0 0 8px}.frame{overflow:auto;max-width:100%}
    iframe{display:block;border:1px solid #9aa3b2;background:#fff}
  </style>
</head>
<body><main>
  <section class="device"><h2>iPhone · 390 × 844</h2><div class="frame"><iframe title="iPhone" src="/" width="390" height="844"></iframe></div></section>
  <section class="device"><h2>Android · 412 × 915</h2><div class="frame"><iframe title="Android" src="/" width="412" height="915"></iframe></div></section>
  <section class="device"><h2>iPad · 768 × 1024</h2><div class="frame"><iframe title="iPad" src="/" width="768" height="1024"></iframe></div></section>
  <section class="device"><h2>Desktop · 1366 × 900</h2><div class="frame"><iframe title="Desktop" src="/" width="1366" height="900"></iframe></div></section>
</main></body></html>
